<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Try-On Result - VITON-HD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-purple: #6366f1;
            --primary-hover: #5558e3;
            --success-color: #10b981;
            --teal-color: #14b8a6;
            --bg-light: #f5f7fa;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-md: 0 4px 12px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-light);
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }
        
        .header {
            background: linear-gradient(135deg, #5b6cf2 0%, #7c5cef 50%, #9d4eed 100%);
            color: white;
            padding: 25px 40px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(91, 108, 242, 0.3);
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s ease;
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
        }
        
        .content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }
        
        .result-container {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin: 30px auto;
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow-md);
            max-width: 800px;
        }
        
        .result-image {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
        }
        
        .image-info {
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }
        
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow-md);
            text-decoration: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #5b6cf2 0%, #7c5cef 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(91, 108, 242, 0.4);
        }
        
        .btn-success {
            background: var(--teal-color);
            color: white;
        }
        
        .btn-success:hover {
            background: #0d9488;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(20, 184, 166, 0.4);
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 22px;
            }
            
            .content {
                padding: 20px 15px;
            }
            
            .result-container {
                padding: 20px;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="back-btn">← Back to Main</a>
        <h1>✨ Virtual Try-On Result</h1>
    </div>
    
    <div class="content">
        <div class="result-container">
            <img src="{{ url_for('serve_result', job_name=job_name, image_name=image_name) }}" alt="Virtual Try-On Result" class="result-image">
            <div class="image-info">{{ image_name }}</div>
        </div>
        
        <div class="action-buttons">
            <a href="/" class="btn btn-primary">
                <span>🏠</span> Try Another
            </a>
            <a href="{{ url_for('serve_result', job_name=job_name, image_name=image_name) }}" download class="btn btn-success">
                <span>💾</span> Download Result
            </a>
        </div>
    </div>
</body>
</html>
